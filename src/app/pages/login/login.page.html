<ion-header>
  <ion-toolbar>
    <ion-title>TrekkMe</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="max-width: 420px; margin: 0 auto; padding-top: 48px;">
    <h1 style="font-weight: 700; margin-bottom: 4px;">Iniciar sesión</h1>
    <p style="margin-top: 0; margin-bottom: 32px;">Elige con qué perfil quieres entrar.</p>

    <!-- Cada botón lleva a la primera pantalla de ese perfil -->
    <ion-button expand="block" size="large" color="primary" routerLink="/carabinero/bandeja">Entrar como carabinero</ion-button>
    <ion-button expand="block" size="large" color="secondary" routerLink="/rescatista/casos">Entrar como rescatista</ion-button>
  </div>
</ion-content>
