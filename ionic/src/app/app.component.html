<ion-app>
  <!-- Menú lateral: se abre con el botón de las tres rayas de cada página -->
  <ion-menu contentId="contenido">
    <ion-header>
      <ion-toolbar>
        <ion-title>TrekkMe</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <!-- ion-menu-toggle cierra el menú al tocar una opción -->
      <ion-menu-toggle [autoHide]="false">
        <ion-list lines="full">
          @if (perfil() === 'carabinero') {
            <ion-list-header><ion-label color="medium">CARABINERO</ion-label></ion-list-header>
            <ion-item routerLink="/carabinero/bandeja" detail="false">Bandeja del turno</ion-item>
            <ion-item routerLink="/carabinero/historico" detail="false">Histórico de avisos</ion-item>
          }

          @if (perfil() === 'rescatista') {
            <ion-list-header><ion-label color="medium">RESCATISTA</ion-label></ion-list-header>
            <ion-item routerLink="/rescatista/casos" detail="false">Casos asignados</ion-item>
          }

          @if (perfil() !== null) {
            <ion-item button detail="false" (click)="salir()">Cerrar sesión</ion-item>
          }
        </ion-list>
      </ion-menu-toggle>
    </ion-content>
  </ion-menu>

  <!-- Aquí se muestra la página de la ruta actual -->
  <ion-router-outlet id="contenido"></ion-router-outlet>
</ion-app>
