<ion-header>
  <ion-toolbar>
    <ion-title>TrekkMe</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="max-width: 420px; margin: 0 auto; padding-top: 48px;">
    <h1 style="font-weight: 700; margin-bottom: 4px;">Iniciar sesión</h1>
    <p style="margin-top: 0; margin-bottom: 32px;">Ingresa con tu cuenta institucional.</p>

    <ion-list lines="full" style="border-radius: 8px; overflow: hidden; margin-bottom: 16px;">
      <ion-item>
        <ion-input label="Correo" labelPlacement="stacked" type="email" autocomplete="email"
          [(ngModel)]="correo" (keyup.enter)="entrar()"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Contraseña" labelPlacement="stacked" type="password" autocomplete="current-password"
          [(ngModel)]="clave" (keyup.enter)="entrar()"></ion-input>
      </ion-item>
    </ion-list>

    @if (error() !== '') {
      <ion-text color="danger"><p>{{ error() }}</p></ion-text>
    }

    <ion-button expand="block" size="large"
      [disabled]="correo().trim() === '' || clave() === '' || entrando()"
      (click)="entrar()">
      @if (entrando()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Entrar
      }
    </ion-button>
  </div>
</ion-content>
